server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container (same cert, no CORS issues)
    location /api/ {
        proxy_pass         http://${API_BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Allow large request bodies (file uploads etc.)
        client_max_body_size 50M;
    }

    # Serve the React SPA — all non-API routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
